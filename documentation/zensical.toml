[project]
site_url = "https://beyondmagic.github.io/wisp/"
site_name = "WISP"
site_description = "A long-desired attempt into creating a new way to use a desktop environment."
site_author = "João V. Farias"
docs_dir = "content"

copyright = "BeyondMagic © 2026"

repo_url = "https://github.com/BeyondMagic/wisp"
repo_name = "BeyondMagic/wisp"
edit_uri = "edit/main/documentation/content/"

extra_css = [
  "stylesheet/typography.css",
  "stylesheet/identity.css",
  "https://cdn.jsdelivr.net/gh/BeyondMagic/zensical-slides@latest/dist/zensical-slides.min.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/gh/BeyondMagic/zensical-slides@latest/dist/zensical-slides.min.mjs",
]

nav = [
  { "General" = [
      { "Introduction" = "index.md" },
      { "Glossary" = "glossary.md" },
      { "Metrics & Results" = "management/metrics.md" },
  ]},
  { "Features" = [
      { "General" = "feature-record/index.md" },
      { "000: Template" = "feature-record/000-template.md" },
      { "001: Plymouth" = "feature-record/001-plymouth.md" },
      { "002: Login" = "feature-record/002-login.md" },
      { "003: Power Management" = "feature-record/003-power-management.md" },
      { "004: System Tray" = "feature-record/004-system-tray.md" },
      { "005: Workspace Tray" = "feature-record/005-workspace-tray.md" },
      { "006: Time Tracker" = "feature-record/006-time-tracker/index.md" },
      { "007: Notifications" = "feature-record/007-notifications.md" },
      { "008: Overview" = "feature-record/008-overview.md" },
      { "009: Launcher" = "feature-record/009-launcher/index.md" },
      { "010: Habit Tracker" = "feature-record/010-habit-tracker.md" },
      { "011: Task Tracker" = "feature-record/011-task-tracker.md" },
      { "012: OCR" = "feature-record/012-ocr.md" },
      { "013: Music Manager" = "feature-record/013-music-manager/index.md" },
      { "014: Service Manager" = "feature-record/014-service-manager/index.md" },
  ]},
  { "Decision Record" = [
      { "General" = "decision-record/index.md" },
      { "000: Template" = "decision-record/000-template.md" },
      { "001: Idea" = "decision-record/001-idea.md" },
      { "002: License" = "decision-record/002-license.md" },
      { "003: Writing Style" = "decision-record/003-writing-style.md" },
      { "004: Name" = "decision-record/004-name.md" },
      { "005: Quality Factors" = "decision-record/005-quality-factors.md" },
      { "006: Requirements" = "decision-record/006-requirements.md" },
      { "007: Architecture" = "decision-record/007-architecture.md" },
      { "008: AI Usage" = "decision-record/008-ai-usage.md" },
      { "009: Visual Identity" = "decision-record/009-visual-identity.md" },
      { "010: UX Paradigm" = "decision-record/010-ux-paradigm.md" },
      { "011: Testing Strategy" = "decision-record/011-testing-strategy.md" },
      { "012: CI/CD & Tooling" = "decision-record/012-ci-cd-and-tooling.md" },
  ]},
]

[project.extra]
generator = false

[project.theme]
logo = "assets/favicon/48.svg"
favicon = "assets/favicon/32.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
pymdownx.snippets = { base_path = "snippets" }

[project.markdown_extensions.zensical_glossary]
glossary_file = "glossary.md"
base_url = "https://beyondmagic.github.io/wisp/glossary/"
heading_level = 3
first_only = true
inline_definitions = true
